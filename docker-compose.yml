version: "3.8"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PII_GLOBAL_RPS=1500
      - PII_APP_PORT=8081
      - PII_STORE_KEY=change-me-32-byte-secret-key
    depends_on:
      - redis

  server2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PII_GLOBAL_RPS=1500
      - PII_APP_PORT=8082
      - PII_STORE_KEY=change-me-32-byte-secret-key
    depends_on:
      - redis

  server3:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PII_GLOBAL_RPS=1500
      - PII_APP_PORT=8083
      - PII_STORE_KEY=change-me-32-byte-secret-key
    depends_on:
      - redis